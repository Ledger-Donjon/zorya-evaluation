# geth (*Block).resolveHeader nil pointer bug
# Function address: 0x1a3acc0
#
# Block struct layout (from DWARF / execution_log.txt):
#   offset  0 (0x00): r             *Resolver          (8 bytes) - [rax + 0x00]
#   offset  8 (0x08): numberOrHash  *BlockNumberOrHash (8 bytes) - [rax + 0x08]
#   offset 16 (0x10): mu            sync.Mutex         (8 bytes) - [rax + 0x10]
#   offset 24 (0x18): hash          common.Hash       (32 bytes) - [rax + 0x18]
#   offset 56 (0x38): header        *types.Header      (8 bytes) - [rax + 0x38]  ← BUG
#   offset 64 (0x40): block         *types.Block       (8 bytes) - [rax + 0x40]

starting from core

# Make b.header symbolic — this is the pointer that is nil after
# HeaderByNumberOrHash returns (nil, nil) for a non-existent block
@[rax + 0x38, 8] := nondet as b_header

# Allow b.header to be nil or a valid user-space pointer
assume b_header = 0 || (b_header >= 0x1000 && b_header < 0x7fffffffffff)

# Stub out HeaderByNumberOrHash so it returns (nil, nil):
#   Go 1.17+ register ABI: (*types.Header, error) → (RAX=0, RBX=0, RCX=0)
replace <github.com/ethereum/go-ethereum/eth.(*EthAPIBackend).HeaderByNumberOrHash> by
  rax := 0
  rbx := 0
  rcx := 0
  return
end

explore all

# Skip printing functions to reduce path explosion
replace <fmt.Sprintf>, <fmt.Fprintf>, <fmt.Printf>, <fmt.Println> by
  return
end

# Abort if execution reaches any panic handler
abort at <runtime.panicmem>
abort at <runtime.gopanic>
