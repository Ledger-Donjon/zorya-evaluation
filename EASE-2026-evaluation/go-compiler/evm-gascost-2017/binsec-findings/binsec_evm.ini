# Binsec SSE configuration for evm-gascost-2017
# Target: github.com/ethereum/go-ethereum/core/vm.memoryGasCost
# Binary: /tmp/geth-160/evm  (standalone EVM, not full geth)
# Function entry address: 0x7b6a40  (verify with: go tool nm /tmp/geth-160/evm | grep memoryGasCost)
#
# Calling convention: Go 1.17+ register ABI (used even for geth v1.6.0 code
# compiled with a modern Go toolchain):
#   RAX = mem  *Memory       (first arg)  ← symbolize as nullable
#   RBX = newMemSize uint64  (second arg) ← THE BUG IS HERE
#
# Memory struct layout (from execution_log.txt / Zorya DWARF introspection):
#   0x00: store      []uint8  (ptr 8 + len 8 + cap 8 = 24 bytes)
#   0x18: lastGasCost uint64
#
# The bug: newMemSizeWords * newMemSizeWords silently overflows uint64.
# Go does NOT panic on unsigned overflow.
# Standard crash-detection abort points are therefore useless for the overflow.
# Binsec can still detect the secondary nil-pointer findings (Finding 1 and 3).

starting from core

# ── Symbolize newMemSize (RBX) ─────────────────────────────────────────────
# Allow any uint64 value — the bug triggers for large values (> ~2^32).
rbx := nondet as newMemSize
assume newMemSize > 0  # skip trivial early-return

# ── Symbolize mem pointer (RAX) — nullable ─────────────────────────────────
# mem can be nil (Finding 1: nil receiver panic in mem.Len())
# or a valid heap address.
rax := nondet as mem_ptr
assume mem_ptr = 0 || (mem_ptr >= 0x1000 && mem_ptr <= 0x7fffffffffff)

# ── Explore all reachable paths ────────────────────────────────────────────
explore all

# ── Stub runtime.morestack to prevent early syscall path cut ───────────────
# Go inserts a stack-growth check at every non-leaf function entry:
#   CMP RSP, stackguard0(g)
#   JBE runtime.morestack
# When Binsec takes the grow-stack branch it enters runtime.morestack
# which calls a futex syscall, immediately cutting the path.
# Stubbing with "return" keeps Binsec on the function body.
replace <runtime.morestack> by
  return
end

replace <runtime.morestack_noexit> by
  return
end

# ── Stub helper / I/O functions to avoid path explosion ───────────────────
replace <fmt.Sprintf>, <fmt.Fprintf>, <fmt.Printf>, <fmt.Println> by
  return
end

# ── Abort (report) at Go runtime panic entry points ────────────────────────
# These catch the nil-pointer findings (F1, F3).
# The integer overflow (F2) does NOT reach any of these — it is silent.
abort at <runtime.panicmem>
abort at <runtime.gopanic>
abort at <runtime.panicdivide>
abort at <runtime.panicIndex>
abort at <runtime.panicSliceB>
abort at <runtime.panicnildereference>

# ── No overflow oracle ─────────────────────────────────────────────────────
# Binsec has no built-in unsigned integer overflow detection.
# The INT_MULT overflow at 0x7b6b03 produces a wrong result silently;
# no panic, no branch change, no abort — Binsec cannot observe it.
