# types.Receipt struct layout (GasUsed is the field being accessed):
#   GasUsed is at offset 0x38 in types.Receipt

starting from core

# ── Symbolize receipt (RBX) ────────────────────────────────────────────────
# receipt can be nil (the bug) or a valid heap pointer
rbx := nondet as receipt_ptr
assume receipt_ptr = 0 || (receipt_ptr >= 0x1000 && receipt_ptr <= 0x7fffffffffff)

# ── Keep err = nil so the early-return guard is not taken ─────────────────
# err is a Go interface {type *itab, value unsafe.Pointer}; nil interface → both zero
rcx := 0  # err.type  = nil
rdi := 0  # err.value = nil

# ── Explore all reachable paths ────────────────────────────────────────────
explore all

# ── Stub helper / I/O functions to avoid path explosion ───────────────────
replace <fmt.Sprintf>, <fmt.Fprintf>, <fmt.Printf>, <fmt.Println> by
  return
end

# clearFailedLogs recurses over the callstack; stub it out so Binsec
# does not have to follow the entire tracer tree.
replace <github.com/ethereum/go-ethereum/eth/tracers/native.clearFailedLogs> by
  return
end

# ── Abort (report) at Go runtime panic entry points ───────────────────────
abort at <runtime.panicmem>
abort at <runtime.gopanic>
abort at <runtime.panicdivide>
abort at <runtime.panicIndex>
abort at <runtime.panicSliceB>
