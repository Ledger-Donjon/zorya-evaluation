#
# Go register calling convention (Go 1.17+):
#   RAX = t  *callTracer           (receiver)
#   RBX = receipt *types.Receipt   (first arg) ← THE BUG IS HERE
#   RCX = err.type  (itab ptr, nil for nil interface)
#   RDI = err.value (data ptr,  nil for nil interface)
#
# callTracer struct layout (from execution_log.txt):
#   0x00: callstack  []callFrame  (ptr 8 + len 8 + cap 8 = 24 bytes)
#   0x18: config     callTracerConfig (embedded struct)
#   ...
