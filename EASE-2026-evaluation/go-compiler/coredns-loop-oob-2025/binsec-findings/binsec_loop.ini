# Binsec SSE configuration for coredns-loop-oob-2025
# Target: github.com/coredns/coredns/plugin/loop.parse
# Binary: /tmp/coredns-vulnerable
#   Built with: git checkout 0d05791 && GO111MODULE=on go build -gcflags="all=-N -l" -o /tmp/coredns-vulnerable .
#
# Function entry address: 0x2f73520
#   Verify with: go tool nm /tmp/coredns-vulnerable | grep "plugin/loop.parse"
#
# ── STEP 0: Generate a GDB core snapshot ─────────────────────────────────────
#
# BINSEC uses "starting from core" to take the concrete machine state at
# parse() entry (with a benign Corefile so CoreDNS starts successfully).
# The benign concrete run provides a valid caddy.Controller pointer in RAX,
# with c.ServerBlockKeys[0] set to the benign zone string (e.g. "example.com:5353").
# We then symbolize the first 7 bytes of that string to let BINSEC explore
# the "unix://" prefix that triggers NormalizeExact() → [].
#
# Generate the snapshot:
#   gdb -q /tmp/coredns-vulnerable \
#     -ex "set confirm off" \
#     -ex "break 'github.com/coredns/coredns/plugin/loop.parse'" \
#     -ex "run -conf /tmp/Corefile.benign" \
#     -ex "generate-core-file /tmp/coredns-loop.snapshot" \
#     -ex "quit"
#
# ── STEP 1: Find the ServerBlockKeys[0] data pointer ─────────────────────────
#
# After taking the snapshot, run GDB to find the pointer:
#
#   gdb -q /tmp/coredns-vulnerable /tmp/coredns-loop.snapshot -batch \
#     -ex "frame 0" \
#     -ex "info register rax" \
#     -ex "x/40gx \$rax"
#
# RAX holds the *caddy.Controller. Scan the hex dump to find a
# pointer that points into Go's heap (typically 0xc000...).
# That pointer at offset +ServerBlockKeys.ptr is the string array.
# Dereference it to get the first string's data pointer:
#
#   (gdb) x/2gx <CONTROLLER_ADDR + sbk_ptr_offset>
#   → first 8 bytes = sbk_data_ptr  (pointer to "example.com:5353" bytes)
#   → next  8 bytes = sbk_len       (length of the string, e.g. 19)
#
# ── STEP 2: Insert the real address below ────────────────────────────────────
#
# Replace 0xc000REPLACE with the actual sbk_data_ptr value from GDB:

starting from core

# ── Symbolize the first 7 bytes of c.ServerBlockKeys[0] ─────────────────────
# These bytes decide the "unix://" vs. normal-zone branch inside NormalizeExact.
# Replace 0xc000REPLACE with the real address (see STEP 1 above).
@[0xc000REPLACE+0x00, 1] := nondet as sb0   # 'u' or other first byte
@[0xc000REPLACE+0x01, 1] := nondet as sb1
@[0xc000REPLACE+0x02, 1] := nondet as sb2
@[0xc000REPLACE+0x03, 1] := nondet as sb3
@[0xc000REPLACE+0x04, 1] := nondet as sb4
@[0xc000REPLACE+0x05, 1] := nondet as sb5
@[0xc000REPLACE+0x06, 1] := nondet as sb6

# Keep total string length concrete (taken from snapshot) so NormalizeExact
# does not have to handle symbolic lengths — the prefix alone determines
# whether the returned slice is empty or not.

explore all

# ── Stub I/O and formatting helpers ──────────────────────────────────────────
replace <fmt.Sprintf>, <fmt.Errorf>, <fmt.Fprintf>, <fmt.Printf>, <fmt.Println> by
  return
end

# ── Abort at Go runtime panic entry points ────────────────────────────────────
# runtime.panicIndex is the direct target — fired by zones[0] when zones is empty.
abort at <runtime.panicIndex>
abort at <runtime.panicSliceB>
abort at <runtime.panicmem>
abort at <runtime.gopanic>
abort at <runtime.panicdivide>

# ── No silent-bug oracle needed ───────────────────────────────────────────────
# Unlike the p224 carry bug (silent wrong value), this bug terminates with a
# hard crash detectable by the abort points above.
# BINSEC should report a "failed assertion" or "abort reached" path for any
# symbolic input that leads to the empty-slice branch of NormalizeExact().
