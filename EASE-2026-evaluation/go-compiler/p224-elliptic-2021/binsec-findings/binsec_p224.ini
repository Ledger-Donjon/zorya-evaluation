# Binsec SSE configuration for p224-elliptic-2021
# Target: crypto/elliptic.p224Contract
# Binary: /tmp/p224-driver  (build with: go build -gcflags="all=-N -l" -o /tmp/p224-driver .)
# Function entry address: 0x4d7840
#   Verify with: go tool nm /tmp/p224-driver | grep p224Contract
#
# Calling convention: Go 1.17+ register ABI
#   RAX = out *P224FieldElement   ([8]uint32, 32 bytes — written by the function)
#   RBX = in  *P224FieldElement   ([8]uint32, 32 bytes — read-only input)
#
# P224FieldElement layout (each limb is 4 bytes, little-endian):
#   Offset  Field
#   +0x00   limb[0]   (radix-2^28 representation of the lowest limb)
#   +0x04   limb[1]
#   +0x08   limb[2]
#   +0x0c   limb[3]   (contains the 2^96 coefficient — key to BUG1)
#   +0x10   limb[4]
#   +0x14   limb[5]
#   +0x18   limb[6]
#   +0x1c   limb[7]
#
# The bug: two silent wrong-value defects
#   BUG1 (line 83/92 vuln_p224.go): out[3]-0xffff000 should be 0xffff000-out[3];
#         out3GT mask is complement-inverted — produces silently wrong conditional P-subtraction
#   BUG2 (after line 95): missing carry-down loop when out[0] underflows to 0xFFFFFFFF
#   Neither bug triggers a panic, signal, or non-zero exit.
#
# Key blocker: runtime.memmove
#   The very first statement of p224Contract is copy(out[:], in[:]).
#   The Go compiler lowers this to runtime.memmove.
#   Binsec cannot interpret the raw memory-copy loop inside memmove;
#   we stub it with "return" and compensate by pre-seeding *rax with
#   the same symbolic limb values that *rbx holds (simulating the copy).

starting from core

# ── Symbolize the input limbs (in[0..7] at *rbx) ──────────────────────────
@[rbx+0x00, 4] := nondet as limb0
@[rbx+0x04, 4] := nondet as limb1
@[rbx+0x08, 4] := nondet as limb2
@[rbx+0x0c, 4] := nondet as limb3
@[rbx+0x10, 4] := nondet as limb4
@[rbx+0x14, 4] := nondet as limb5
@[rbx+0x18, 4] := nondet as limb6
@[rbx+0x1c, 4] := nondet as limb7

# Restrict limbs to 29-bit range (precondition of p224Contract)
assume limb0 <= 0x1fffffff
assume limb1 <= 0x1fffffff
assume limb2 <= 0x1fffffff
assume limb3 <= 0x1fffffff
assume limb4 <= 0x1fffffff
assume limb5 <= 0x1fffffff
assume limb6 <= 0x1fffffff
assume limb7 <= 0x1fffffff

# ── Seed *rax with the same symbolic values (simulates copy(out[:], in[:])) ─
# runtime.memmove is stubbed below; without this, *rax would remain concrete
# (snapshot garbage) and the carry arithmetic would never see symbolic data.
@[rax+0x00, 4] := limb0
@[rax+0x04, 4] := limb1
@[rax+0x08, 4] := limb2
@[rax+0x0c, 4] := limb3
@[rax+0x10, 4] := limb4
@[rax+0x14, 4] := limb5
@[rax+0x18, 4] := limb6
@[rax+0x1c, 4] := limb7

explore all

# ── Stub runtime.memmove (the copy at the top of p224Contract) ────────────
# copy(out[:], in[:]) compiles to runtime.memmove(rax, rbx, 0x20).
# Binsec cannot interpret the SIMD/rep-movsb loop inside memmove.
# The copy is already simulated above by pre-seeding *rax.
replace <runtime.memmove> by
  return
end

# ── Stub I/O helpers to reduce path explosion ──────────────────────────────
replace <fmt.Sprintf>, <fmt.Fprintf>, <fmt.Printf> by
  return
end

# ── Abort (report) at Go runtime panic entry points ────────────────────────
# These would catch nil dereferences and index-out-of-bounds panics.
# The p224 carry bug does NOT reach any of these — it is a silent wrong
# uint32 result with no branch change and no signal.
abort at <runtime.panicmem>
abort at <runtime.gopanic>
abort at <runtime.panicdivide>
abort at <runtime.panicIndex>
abort at <runtime.panicSliceB>

# ── No arithmetic-correctness oracle ───────────────────────────────────────
# BUG1 (inverted out3GT mask) and BUG2 (missing carry-down loop) both produce
# a wrong [8]uint32 output without triggering any abort point above.
# Detecting them would require an explicit postcondition such as:
#   assert @[rax+0x0c, 4] <= 0xffff000   (out[3] must be fully reduced)
#   assert @[rax+0x00, 4] < 0x10000000   (no underflow residue in out[0])
# Such assertions are not included here — faithfully reproducing the
# no-oracle scenario in which standard crash-based analysis is blind.
